<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denise Franke</title>
<meta name="description" content="Denise Franke">
<style>
  :root { --bg: #fbfaf7; --text: #1f2a2e; --muted: #5f6b6f; --link: #1d5c63; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161b1d; --text: #e8ecec; --muted: #9aa6a8; --link: #7cc4c9; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center;
  }
  h1 { font-weight: normal; font-size: clamp(2.2rem, 7vw, 3.5rem); margin: 0 0 .4em; letter-spacing: .01em; }
  p { color: var(--muted); font-size: 1.1rem; margin: 0 0 2em; }
  nav { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: .95rem; }
  a { color: var(--link); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover, a:focus-visible { border-bottom-color: currentColor; }
  footer { position: fixed; bottom: 16px; left: 0; right: 0; color: var(--muted);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>Denise Franke</h1>
  <p>New website coming soon.</p>
  <nav>
    <a href="https://www.linkedin.com/in/denisefranke/">LinkedIn</a>
    <a href="https://github.com/DeniseFranke">GitHub</a>
    <a href="https://www.youtube.com/channel/UC7MyRlGVYr9llobjIIo0hVw">YouTube</a>
    <a href="https://www.instagram.com/charmedlife000/">Instagram</a>
    <a href="https://www.facebook.com/denise.franke">Facebook</a>
  </nav>
</main>
<footer>&copy; 2026 Denise Franke</footer>
</body>
</html>
